<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  MiWith 系列字体（CJK 合并等宽字体）的 spacing 声明。
  fontconfig 靠实测字形宽度判定等宽，含 CJK 的字体天然有全角/半角两种 advance，
  会被判为 dual 而非 mono，导致 GNOME 终端等只列等宽字体的软件不显示它们。
  此处在扫描阶段强制声明 mono。随 install_fonts.sh 部署到
  ~/.config/fontconfig/conf.d/66-miwith-mono.conf。
-->
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>MiWithIAMono</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>MiWithIAMonoHalf</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>MiWithJBMono</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>MiWithJBMonoNL</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>MiWithJBMonoHalf</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
  <match target="scan">
    <test name="family">
      <string>MiWithJBMonoHalfNL</string>
    </test>
    <edit name="spacing" mode="assign">
      <int>100</int>
    </edit>
  </match>
</fontconfig>
